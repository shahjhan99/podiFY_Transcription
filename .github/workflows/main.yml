name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create SSH key file
      run: |
        printf "%s\n" "$EC2_SSH_KEY" > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: SSH into EC2 and deploy project
      run: |
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no ubuntu@${EC2_PUBLIC_IP} << 'EOF'
          cd /home/ubuntu/podiFY_Transcription
          # Stop previous tmux session if running
          tmux kill-session -t podifyapp || true
          # Start the app in a new tmux session
          tmux new -d -s podifyapp "python3 app.py"
        EOF
      env:
        EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
